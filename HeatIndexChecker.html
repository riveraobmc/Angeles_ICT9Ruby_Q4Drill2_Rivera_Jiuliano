<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heat Index Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="p-5">

    <div class="container bg-dark text-white p-4 rounded shadow-lg" style="max-width: 500px;">
        <h2>Heat Index Checker</h2>

        <p class="small text-secondary">Enter the temperature (°C) and humidity (%), then click check to see the heat index and its status.</p>

        <div class="mt-3">
            <label>Degree in °C</label>
            <input type="number" id="tempInput" class="form-control" placeholder="Input degree value">
        </div>

        <div class="mt-3">
            <label>Humidity in %</label>
            <input type="number" id="humInput" class="form-control" placeholder="Input percentage value">
        </div>

        <button onclick="checkHeatIndex()" class="btn btn-warning mt-4 w-100">Check</button>
    </div>

    <script src="main.js"></script>

</html>
    <script>
        function checkHeatIndex() {
            var temp = parseFloat(document.getElementById("tempInput").value);
            var humidity = parseFloat(document.getElementById("humInput").value);

            var heatIndex = temp + (humidity * 0.25);
            var status;

            switch (true) {
                case (heatIndex >= 41):
                    status = "Danger";
                    break;
                case (heatIndex >= 32):
                    status = "Hot";
                    break;
                case (heatIndex >= 27):
                    status = "Caution";
                    break;
                default:
                    status = "Normal";
            }

            alert("Heat Index: " + heatIndex.toFixed(1) + "°C\nStatus: " + status);

            document.getElementById("result").innerHTML = "Heat Index: " + heatIndex.toFixed(1) + "°C";

            document.getElementById("description").innerHTML = "Status: " + status;
        }
    </script>

<script src="main.js"></script>
</body>
